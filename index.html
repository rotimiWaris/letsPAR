<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0a08" />
    <meta
      name="description"
      content="LetsPAR is a NEAR memecoin where equal amounts swap bags. Unequal amounts are refused. Unmatched bags come back whole."
    />
    <title>LetsPAR — same amount, bags swap</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      window.global = window;
      window.process = window.process || {
        env: {},
        browser: true,
        version: "",
        versions: {},
        nextTick(fn, ...args) {
          queueMicrotask(() => fn(...args));
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>LetsPAR needs JavaScript to read the testnet board and to sign with a wallet.</noscript>
  </body>
</html>
