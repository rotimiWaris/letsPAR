[package]
name = "letspar-token"
version = "1.0.0"
edition = "2021"
publish = false
description = "LetsPAR token and equal-swap escrow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.2"

[dev-dependencies]
near-sdk = { version = "5.30.2", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
